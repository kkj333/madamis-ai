# ADK Developer UI overlay (Vertex AI, in-memory sessions).
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up --build backend
#
# Open http://localhost:8001 and select the madamis app.
# Requires: backend/.env (GOOGLE_CLOUD_*), `gcloud auth application-default login`

services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    ports: !override
      - "8001:8000"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      GOOGLE_GENAI_USE_VERTEXAI: "1"
      GOOGLE_CLOUD_LOCATION: global
    command:
      - /app/.venv/bin/adk
      - web
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - .
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
